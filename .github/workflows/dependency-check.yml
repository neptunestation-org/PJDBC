name: OWASP Dependency Check

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]
  schedule:
    # Run weekly on Monday at 6 AM UTC
    - cron: '0 6 * * 1'
  workflow_dispatch:

jobs:
  dependency-check:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write

    steps:
    - uses: actions/checkout@v6

    - name: Set up JDK 21
      uses: actions/setup-java@v5
      with:
        java-version: '21'
        distribution: 'temurin'
        cache: maven

    - name: Cache OWASP database
      uses: actions/cache@v4
      with:
        path: ~/.owasp
        key: ${{ runner.os }}-owasp-db-${{ hashFiles('**/pom.xml') }}
        restore-keys: |
          ${{ runner.os }}-owasp-db-

    - name: Run OWASP Dependency-Check
      continue-on-error: true
      id: run_check
      env:
        NVD_API_KEY: ${{ secrets.NVD_API_KEY }}
      run: |
        mvn -B org.owasp:dependency-check-maven:check \
          -DfailBuildOnCVSS=7 \
          -Dformats=HTML,SARIF \
          -DenableExperimental=true \
          -DossIndexAnalyzerEnabled=false \
          ${NVD_API_KEY:+-DnvdApiKey=$NVD_API_KEY}

    - name: Check SARIF report existence
      id: sarif_check
      if: always()
      run: |
        if [ -f target/dependency-check-report.sarif ]; then
          echo "exists=true" >> $GITHUB_OUTPUT
        else
          echo "exists=false" >> $GITHUB_OUTPUT
        fi

    - name: Upload Dependency-Check report
      uses: actions/upload-artifact@v6
      if: always()
      with:
        name: dependency-check-report
        path: target/dependency-check-report.*

    - name: Upload SARIF to GitHub Security
      uses: github/codeql-action/upload-sarif@v4
      if: always() && steps.sarif_check.outputs.exists == 'true'
      with:
        sarif_file: target/dependency-check-report.sarif

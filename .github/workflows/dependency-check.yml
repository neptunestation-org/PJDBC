name: OWASP Dependency Check

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]
  schedule:
    # Run weekly on Monday at 6 AM UTC
    - cron: '0 6 * * 1'
  workflow_dispatch:

jobs:
  dependency-check:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write

    steps:
    - uses: actions/checkout@v4

    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'
        cache: maven

    - name: Cache OWASP Data
      uses: actions/cache@v4
      with:
        path: ~/.owasp
        key: ${{ runner.os }}-owasp-data
        restore-keys: |
          ${{ runner.os }}-owasp-data

    - name: Cleanup Stale Locks
      run: rm -f ~/.owasp/*.lock.db 2>/dev/null || true

    - name: Run OWASP Dependency-Check
      env:
        NVD_API_KEY: ${{ secrets.NVD_API_KEY }}
      run: |
        MAX_RETRIES=3
        RETRY_COUNT=0
        until [ $RETRY_COUNT -ge $MAX_RETRIES ]
        do
          mvn -B org.owasp:dependency-check-maven:check \
            -DfailBuildOnCVSS=7 \
            -Dformats=HTML,SARIF \
            -DenableExperimental=true \
            -DossIndexAnalyzerEnabled=false \
            ${NVD_API_KEY:+-DnvdApiKey=$NVD_API_KEY} && break
          RETRY_COUNT=$((RETRY_COUNT+1))
          echo "Scan failed, retrying ($RETRY_COUNT/$MAX_RETRIES)..."
          sleep 30
        done
        if [ $RETRY_COUNT -eq $MAX_RETRIES ]; then
          echo "Scan failed after $MAX_RETRIES attempts."
          exit 1
        fi

    - name: Upload Dependency-Check report
      uses: actions/upload-artifact@v4
      if: always()
      continue-on-error: true
      with:
        name: dependency-check-report
        path: target/dependency-check-report.*

    - name: Upload SARIF to GitHub Security
      uses: github/codeql-action/upload-sarif@v4
      if: always()
      continue-on-error: true
      with:
        sarif_file: target/dependency-check-report.sarif

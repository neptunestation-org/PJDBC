name: Release

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (e.g., v1.2.0)'
        required: true

jobs:
  build-and-attest:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write

    steps:
    - uses: actions/checkout@v4

    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'
        cache: maven

    - name: Build with Maven
      run: mvn -B package -DskipTests

    - name: Get artifact paths
      id: artifacts
      run: |
        JAR_FILE=$(ls target/PJDBC-*.jar | grep -v sources | grep -v javadoc | head -1)
        echo "jar=$JAR_FILE" >> $GITHUB_OUTPUT
        echo "sbom_json=target/bom.json" >> $GITHUB_OUTPUT
        echo "sbom_xml=target/bom.xml" >> $GITHUB_OUTPUT

    - name: Attest JAR
      uses: actions/attest-build-provenance@v3
      with:
        subject-path: ${{ steps.artifacts.outputs.jar }}

    - name: Attest SBOM (JSON)
      uses: actions/attest-build-provenance@v3
      with:
        subject-path: ${{ steps.artifacts.outputs.sbom_json }}

    - name: Attest SBOM (XML)
      uses: actions/attest-build-provenance@v3
      with:
        subject-path: ${{ steps.artifacts.outputs.sbom_xml }}

    - name: Upload artifacts to release
      if: github.event_name == 'release'
      uses: softprops/action-gh-release@v2
      with:
        files: |
          ${{ steps.artifacts.outputs.jar }}
          ${{ steps.artifacts.outputs.sbom_json }}
          ${{ steps.artifacts.outputs.sbom_xml }}

    - name: Upload artifacts (manual run)
      if: github.event_name == 'workflow_dispatch'
      uses: actions/upload-artifact@v4
      with:
        name: release-artifacts
        path: |
          ${{ steps.artifacts.outputs.jar }}
          ${{ steps.artifacts.outputs.sbom_json }}
          ${{ steps.artifacts.outputs.sbom_xml }}
